[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-credential-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Purpose-specific local composition of Crowsi authorization and credential custody"
license = "Apache-2.0"
readme = "README.md"
publish = false
autotests = false
repository = "https://github.com/crowsi-net/crowsi-credential-agent"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
crowsi-credential-broker = { version = "=0.1.0", registry = "ecosystem-private" }
crowsi-local-control-bridge = { version = "=0.1.0", registry = "ecosystem-private" }
nix = { version = "0.29.0", features = ["fs", "signal", "socket", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.3.18"
zeroize = "1.8.2"

[dev-dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
ihat-identity-assertion-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[[test]]
name = "enrollment"
path = "tests/harnesses/enrollment.rs"

[[test]]
name = "runtime"
path = "tests/harnesses/runtime.rs"
